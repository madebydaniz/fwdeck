name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The optional D-Bus backend must also stay clean.
      - run: cargo clippy --all-targets --features dbus --locked -- -D warnings

  feature-matrix:
    name: Build feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --features dbus --locked
      # Validate the crate packages cleanly, long before a release cuts it.
      - run: cargo publish --dry-run --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Real-daemon tests are #[ignore]d; this suite never touches a firewall.
      - run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --all-targets --locked

  deny:
    name: Licenses & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  zizmor:
    name: Zizmor (Actions security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  fuzz:
    name: Fuzz targets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Type-check the parser fuzz targets against the current parser API — a
      # signature-drift guard that needs neither nightly nor a sanitizer. The
      # full instrumented build (`cargo +nightly fuzz build`) and real fuzzing
      # (`cargo +nightly fuzz run <target>`) are run on demand; current nightly
      # hits an upstream rustc ICE compiling tokio under -Zsanitizer=address.
      - run: cargo check --manifest-path fuzz/Cargo.toml

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-shear
      - run: cargo shear --deny-warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Gated at a floor well below current (~72%) so a real coverage cliff
      # reddens CI while normal fluctuation does not; also shown in the summary.
      - name: Coverage
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov --locked --all-features --fail-under-lines 65 --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  packaging-versions:
    name: Packaging versions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Catch the release-process gap where a bump lands in Cargo.toml but the
      # distro packaging files (AUR/Copr/Nix) are left on the old version.
      - name: Packaging files must match the crate version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "crate version: ${version}"
          fail=0
          pkg=$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2 | awk '{print $1}')
          spec=$(grep -m1 '^Version:' packaging/fwdeck.spec | awk '{print $2}')
          flake=$(grep -m1 'version = "' flake.nix | cut -d'"' -f2)
          for entry in "PKGBUILD:${pkg}" "fwdeck.spec:${spec}" "flake.nix:${flake}"; do
            if [ "${entry#*:}" != "${version}" ]; then
              echo "::error::${entry%%:*} is at ${entry#*:}, expected ${version}"
              fail=1
            fi
          done
          exit "${fail}"

  real-firewalld:
    name: Real firewalld (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dev
            distro: fedora-44 # firewalld 2.4.x
          - service: dev-debian
            distro: debian-13 # firewalld 2.3.x
          - service: dev-el9
            distro: almalinux-9 # firewalld 1.x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # The dev container can't reach crates.io on hosted runners (fresh cargo
      # cache, no container egress). Fetch the locked deps on the runner, which
      # has network, then mount them in for a fully offline build. `-f
      # docker-compose.yml` also skips docker-compose.override.yml (local-only).
      - name: Pre-fetch crates on the runner
        run: cargo fetch --locked
      - name: Build dev image
        run: docker compose -f docker-compose.yml build ${{ matrix.service }}
      - name: Run real-daemon suite (serial, offline)
        run: |
          docker compose -f docker-compose.yml run --rm \
            -e CARGO_HOME=/ci-cargo \
            -v "$HOME/.cargo/registry:/ci-cargo/registry" \
            ${{ matrix.service }} bash -c \
            "cargo test --offline --features dbus --test real_firewalld -- --ignored --test-threads=1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
