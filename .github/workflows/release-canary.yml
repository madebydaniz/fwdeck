name: release-canary

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.nix"
      - "packaging/**"
      - "scripts/**"
  push:
    branches: [develop, main, master]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.nix"
      - "packaging/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package canary
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      release_tag: v0.0.0
      checkout_ref: ${{ github.sha }}
      build_matrix: >-
        {"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]}

  verify:
    name: Verify release artifact chain
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fwdeck-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.rpm *.deb > checksums.txt

      - name: Generate canary SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/fwdeck-canary.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pull requests, including Dependabot, do not need a trusted publishing
      # identity. An ephemeral key still exercises the exact blob sign/verify
      # commands without granting the PR any external write capability.
      - name: Verify Cosign round trip with an ephemeral key
        if: github.event_name != 'push'
        shell: bash
        env:
          COSIGN_PASSWORD: canary-only
        run: |
          set -euo pipefail
          cosign generate-key-pair
          cosign signing-config create \
            --no-default-fulcio \
            --no-default-oidc \
            --no-default-rekor \
            --no-default-tsa \
            --out canary-signing-config.json
          cosign sign-blob \
            --yes \
            --key cosign.key \
            --signing-config canary-signing-config.json \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt
          cosign verify-blob \
            --key cosign.pub \
            --bundle dist/checksums.txt.bundle \
            --insecure-ignore-tlog \
            dist/checksums.txt
          mv cosign.pub dist/cosign.pub
          rm cosign.key

      - name: Sign canary checksums with GitHub OIDC
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release-canary\.yml@refs/heads/(develop|main|master)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/checksums.txt

      - name: Attest canary provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/fwdeck-canary.spdx.json

      - name: Upload verified canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-canary-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
