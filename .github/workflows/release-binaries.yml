name: release-binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (run this workflow from the same tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        name: Require an exact SemVer tag ref
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag '${RELEASE_TAG}'"
            exit 1
          fi
          if [[ "${REF_TYPE}" != "tag" || "${REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "::error::release signing must run from refs/tags/${RELEASE_TAG}"
            echo "For manual recovery: gh workflow run release-binaries.yml --ref ${RELEASE_TAG} -f release_tag=${RELEASE_TAG}"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and package release artifacts
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}
      checkout_ref: ${{ needs.validate-release.outputs.release_tag }}

  sign-and-publish:
    name: Sign and publish
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate-release.outputs.release_tag }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fwdeck-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.rpm *.deb > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign checksums file (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify tag-bound signing identity
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release-binaries\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/checksums.txt

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          path: .
          format: spdx-json
          output-file: dist/fwdeck.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/fwdeck.spdx.json

      - name: Upload release assets
        # zizmor: ignore[superfluous-actions] — action-gh-release gives multi-file
        # upload + overwrite that a plain `gh release` script would reimplement.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate-release.outputs.release_tag }}
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/checksums.txt.bundle
            dist/fwdeck.spdx.json

  publish-crate:
    if: github.event_name == 'release'
    name: Publish crate
    runs-on: ubuntu-latest
    needs: validate-release
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate-release.outputs.release_tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
