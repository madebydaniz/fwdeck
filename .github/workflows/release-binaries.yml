name: release-binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build assets for (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-binaries-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.inputs.release_tag || github.event.release.tag_name, 'v')
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag || github.event.release.tag_name }}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag '${TAG}' for release-binaries"
            exit 1
          fi

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # Pinned for reproducible release builds (matches the tested MSRV).
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build fwdeck
        # The dbus feature ships in release binaries so `--backend dbus` works
        # out of the box.
        run: cargo build --release --locked --features dbus --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag || github.event.release.tag_name }}"
          TARGET="${{ matrix.target }}"
          NAME="fwdeck-${TAG}-${TARGET}"
          BIN="target/${TARGET}/release/fwdeck"
          mkdir -p "${NAME}/completions"
          cp "${BIN}" "${NAME}/"
          cp README.md LICENSE CHANGELOG.md "${NAME}/"
          # Both gnu and musl binaries run natively on their build runner.
          for shell in bash zsh fish; do
            "${BIN}" completions "${shell}" > "${NAME}/completions/fwdeck.${shell}"
          done
          "${BIN}" manpage > "${NAME}/fwdeck.1"
          mkdir -p dist
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"

      - name: Build RPM and DEB packages
        # Only the glibc builds ship as distro packages; musl stays tar.gz-only.
        if: endsWith(matrix.target, '-gnu')
        shell: bash
        env:
          # Multi-arch image (amd64 + arm64), pinned by index digest.
          NFPM_IMAGE: ghcr.io/goreleaser/nfpm@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c # v2.47.0
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag || github.event.release.tag_name }}"
          TARGET="${{ matrix.target }}"
          NAME="fwdeck-${TAG}-${TARGET}"
          case "${TARGET}" in
            x86_64-*)  ARCH=amd64 ;;
            aarch64-*) ARCH=arm64 ;;
            *) echo "::error::no package arch mapping for ${TARGET}"; exit 1 ;;
          esac
          # nfpm does not compress man pages; gzip it here (-n for reproducibility).
          gzip -9 -n -c "${NAME}/fwdeck.1" > "${NAME}/fwdeck.1.gz"
          # nfpm does not expand env vars in content paths — render a concrete
          # config for this target instead.
          sed -e "s|\${NFPM_ARCH}|${ARCH}|g" \
              -e "s|\${NFPM_VERSION}|${TAG#v}|g" \
              -e "s|\${NFPM_STAGING}|${NAME}|g" \
              packaging/nfpm.yaml > nfpm.rendered.yaml
          for packager in rpm deb; do
            docker run --rm \
              --volume "${PWD}:/work" \
              --workdir /work \
              "${NFPM_IMAGE}" package \
              --config nfpm.rendered.yaml \
              --packager "${packager}" \
              --target dist/
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwdeck-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  sign-and-publish:
    if: startsWith(github.event.inputs.release_tag || github.event.release.tag_name, 'v')
    name: sign-and-publish
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fwdeck-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.rpm *.deb > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign checksums file (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify checksums signature with cosign
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\\.github/workflows/release-binaries\\.yml@refs/(heads/main|tags/.+)$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          path: .
          format: spdx-json
          output-file: dist/fwdeck.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/checksums.txt.bundle
            dist/fwdeck.spdx.json

  publish-crate:
    # Publish the source crate to crates.io. Only on a real published release
    # (never on workflow_dispatch asset rebuilds, which would hit an
    # already-published version). Independent of the binary/signing jobs.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    name: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
