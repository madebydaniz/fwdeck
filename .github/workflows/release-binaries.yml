name: release-binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build assets for (for example v0.1.0)
        required: true
        type: string

# Least privilege by default; jobs opt into the writes they actually need.
permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.inputs.release_tag || github.event.release.tag_name, 'v')
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag '${TAG}' for release-binaries"
            exit 1
          fi

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # Pinned for reproducible release builds (matches the tested MSRV).
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      # No build cache on the release path: signed, published binaries must be
      # built from scratch so a poisoned cache can never reach a release.
      - name: Build fwdeck
        # The dbus feature ships in release binaries so `--backend dbus` works
        # out of the box.
        run: cargo build --release --locked --features dbus --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          TARGET="${{ matrix.target }}"
          NAME="fwdeck-${TAG}-${TARGET}"
          BIN="target/${TARGET}/release/fwdeck"
          mkdir -p "${NAME}/completions"
          cp "${BIN}" "${NAME}/"
          cp README.md LICENSE CHANGELOG.md "${NAME}/"
          # Both gnu and musl binaries run natively on their build runner.
          for shell in bash zsh fish; do
            "${BIN}" completions "${shell}" > "${NAME}/completions/fwdeck.${shell}"
          done
          "${BIN}" manpage > "${NAME}/fwdeck.1"
          mkdir -p dist
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"

      - name: Build RPM and DEB packages
        # Only the glibc builds ship as distro packages; musl stays tar.gz-only.
        if: endsWith(matrix.target, '-gnu')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          # Multi-arch image (amd64 + arm64), pinned by index digest.
          NFPM_IMAGE: ghcr.io/goreleaser/nfpm@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c # v2.47.0
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          TARGET="${{ matrix.target }}"
          NAME="fwdeck-${TAG}-${TARGET}"
          case "${TARGET}" in
            x86_64-*)  ARCH=amd64 ;;
            aarch64-*) ARCH=arm64 ;;
            *) echo "::error::no package arch mapping for ${TARGET}"; exit 1 ;;
          esac
          # nfpm does not compress man pages; gzip it here (-n for reproducibility).
          gzip -9 -n -c "${NAME}/fwdeck.1" > "${NAME}/fwdeck.1.gz"
          # nfpm does not expand env vars in content paths — render a concrete
          # config for this target instead.
          sed -e "s|\${NFPM_ARCH}|${ARCH}|g" \
              -e "s|\${NFPM_VERSION}|${TAG#v}|g" \
              -e "s|\${NFPM_STAGING}|${NAME}|g" \
              packaging/nfpm.yaml > nfpm.rendered.yaml
          for packager in rpm deb; do
            docker run --rm \
              --volume "${PWD}:/work" \
              --workdir /work \
              "${NFPM_IMAGE}" package \
              --config nfpm.rendered.yaml \
              --packager "${packager}" \
              --target dist/
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fwdeck-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  sign-and-publish:
    if: startsWith(github.event.inputs.release_tag || github.event.release.tag_name, 'v')
    name: sign-and-publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write # upload release assets
      id-token: write # cosign keyless + SLSA provenance
      attestations: write # attest-build-provenance

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fwdeck-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.rpm *.deb > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums file (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify checksums signature with cosign
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\\.github/workflows/release-binaries\\.yml@refs/tags/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/fwdeck.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/fwdeck.spdx.json

      - name: Upload release assets
        # zizmor: ignore[superfluous-actions] — action-gh-release gives multi-file
        # upload + overwrite that a plain `gh release` script would reimplement.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/checksums.txt.bundle
            dist/fwdeck.spdx.json

  publish-crate:
    # Publish the source crate to crates.io via OIDC Trusted Publishing — no
    # long-lived token. Only on a real published release (never on
    # workflow_dispatch rebuilds, which would hit an already-published version).
    # Independent of the binary/signing jobs.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    name: publish-crate
    runs-on: ubuntu-latest
    # Must match the Trusted Publisher configured on crates.io (owner
    # madebydaniz, repo fwdeck, workflow release-binaries.yml, environment
    # release); the OIDC token's environment claim is verified against it.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC exchange for a short-lived crates.io token

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
