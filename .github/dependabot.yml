version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # Wait a week after a version is published before proposing it, so a
    # compromised release has time to be yanked before Dependabot pulls it in.
    cooldown:
      default-days: 7
    # One PR for all minor/patch bumps; majors stay separate for review.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Keep routine bumps together, but isolate majors so release-critical
    # actions can be behaviorally reviewed and reverted independently.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
