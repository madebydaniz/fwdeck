name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the operator workflow that is painful or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Keybindings, palette commands, flags…
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you do this today (raw firewall-cmd, scripts, other tools)?
