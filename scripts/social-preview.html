<!doctype html>
<!-- GitHub social-preview card (1280x640). Regenerate the PNG with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless=new --screenshot=assets/social-preview.png \
    --window-size=1280,640 --hide-scrollbars scripts/social-preview.html
  Then upload assets/social-preview.png in GitHub → Settings → Social preview.
-->
<html lang="en"><head><meta charset="utf-8"><style>
  :root{
    --fg:#eceef8; --muted:#8b90ad; --line:#262838;
    --purple:#bd93f9; --pink:#ff79c6; --green:#50fa7b; --cyan:#8be9fd;
    --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;box-sizing:border-box}
  body{width:1280px;height:640px;background:#0d0e16;color:var(--fg);
    font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .glow{position:absolute;inset:-120px -200px auto;height:520px;
    background:radial-gradient(720px 300px at 50% 42%,rgba(189,147,249,.20),transparent 70%);
    filter:blur(6px)}
  .card{position:relative;text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:26px}
  .brand img{width:92px;height:92px}
  .brand .name{font-size:84px;font-weight:800;letter-spacing:-2px}
  .brand .name b{background:linear-gradient(90deg,var(--purple),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:34px;font-weight:600;margin-bottom:14px}
  .tag em{font-style:normal;background:linear-gradient(90deg,var(--purple),var(--pink),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:23px;color:var(--muted);margin-bottom:38px}
  .term{display:inline-flex;align-items:center;font-family:var(--mono);font-size:22px;
    padding:14px 26px;border:1px solid var(--line);border-radius:12px;background:#14151f;
    box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .term .g{color:var(--green)}
</style></head><body>
  <div class="glow"></div>
  <div class="card">
    <div class="brand">
      <img src="../assets/logo-dark.svg" alt="">
      <div class="name">FW<b>Deck</b></div>
    </div>
    <div class="tag">Your firewall, on one screen. <em>Nothing applied without review.</em></div>
    <div class="sub">A safety-first terminal UI for firewalld — with a dead-man's switch against lockouts</div>
    <div class="term"><span><span class="g">$</span> sudo fwdeck</span></div>
  </div>
</body></html>
