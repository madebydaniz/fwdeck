# Local-only overrides, auto-loaded by `docker compose` (no -f needed).
#
# The dev containers' default resolver can flake on crates.io behind some
# local VM networks (OrbStack / Docker Desktop), so pin public DNS here. CI
# doesn't use this file (it runs `-f docker-compose.yml` only): the hosted
# runner's containers have no reliable network egress at all, so CI builds
# offline from crates pre-fetched on the runner instead (see ci.yml).
services:
  dev:
    dns:
      - 8.8.8.8
      - 1.1.1.1
  dev-el9:
    dns:
      - 8.8.8.8
      - 1.1.1.1
  dev-debian:
    dns:
      - 8.8.8.8
      - 1.1.1.1
