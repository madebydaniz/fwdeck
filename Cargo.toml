[package]
name = "fwdeck"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"

description = "A safety-first terminal user interface for inspecting and managing firewalld."
authors = ["madebydaniz"]
license = "MIT"
readme = "README.md"

homepage = "https://madebydaniz.github.io/fwdeck/"
documentation = "https://madebydaniz.github.io/fwdeck/docs/"
repository = "https://github.com/madebydaniz/fwdeck"

keywords = [
    "firewalld",
    "firewall",
    "tui",
    "linux",
    "sysadmin",
]

categories = [
    "command-line-utilities",
    "network-programming",
    "os::linux-apis",
]

# Keep the published crate lean: ship only what building the binary needs.
# Screenshots, the website, CI config, the dev container, dev-tooling notes,
# and the integration tests are not required by `cargo install`.
exclude = [
    "assets/",
    "site/",
    "docker/",
    "docker-compose.yml",
    "docker-compose.override.yml",
    ".github/",
    "scripts/",
    "tests/",
    "fuzz/",
    "packaging/",
    "deny.toml",
    "clippy.toml",
    "rustfmt.toml",
    "_typos.toml",
    "Makefile",
    "CLAUDE.md",
    "AGENTS.md",
    "GEMINI.md",
    "flake.nix",
    "flake.lock",
]

# `cargo binstall fwdeck` fetches the signed release tarball instead of building
# from source. The URL and in-archive path match release-binaries.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fwdeck-v{ version }-{ target }.tar.gz"
bin-dir = "fwdeck-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0"

clap = { version = "4.5", features = [
    "derive",
    "env",
] }

clap_complete = "4.5"
clap_mangen = "0.3"

crossterm = { version = "0.29", features = [
    "event-stream",
] }

directories = "6.0"
futures-util = "0.3"
ratatui = "0.30.2"

serde = { version = "1.0", features = [
    "derive",
] }

serde_json = "1.0"

strum = { version = "0.28", features = [
    "derive",
] }

thiserror = "2.0"

tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

toml = "1.1"
tracing = "0.1"

tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
] }

zbus = { version = "5.17", default-features = false, features = [
    "tokio",
], optional = true }

[features]
default = []
# Native firewalld D-Bus backend (ADR-4). Off by default: the CLI backend is
# the reference implementation. Build with `--features dbus`.
dbus = ["dep:zbus"]

[dev-dependencies]
# (none currently — the suite uses std assertions and in-repo fixtures)

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"