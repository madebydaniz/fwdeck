# cargo-deny configuration — license, advisory, and duplicate checks run in CI.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # File-level weak copyleft. Only reaches us as an unmodified transitive
    # dependency (option-ext -> dirs-sys -> directories), so it imposes no
    # obligation on fwdeck's MIT-licensed sources or binary.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
